name: Deploy "Đánh giá tín dụng vay" to GitHub Pages

# Chỉ chạy thủ công: bản standalone gọi Gemini từ trình duyệt (khóa trong localStorage),
# không đúng nguyên tắc "API key chỉ ở Python backend" của bản Streamlit.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:standalone
      # Optional custom domain: add a repository variable CUSTOM_DOMAIN (e.g. tindung.example.com)
      - name: Add CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist-standalone/CNAME
      - run: cp dist-standalone/index.html dist-standalone/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-standalone
      - id: deployment
        uses: actions/deploy-pages@v4
